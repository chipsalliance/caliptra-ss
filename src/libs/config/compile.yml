---
# Keep the UVM implementation and Avery runtime common to subsystem testbenches.
provides: [ss_avery_common_vip]
schema_version: 2.4.0
requires:
  - 3rd_party_frameworks::uvm
targets:
  tb:
    directories:
      - $AVERY_SIM
      - $AVERY_SIM/src
      - $AVERY_SIM/src.IEEE
      - $AVERY_PLI
    files:
      - $AVERY_SIM/src/avery_pkg.sv
      - $AVERY_SIM/src/avery_pkg_test.sv
    # Dependency target options accumulate; dependency global options do not.
    options:
      - tool:
          vcs:
            - +define+AVERY_VCS
            - +define+AVERY_ASSERT_ON
            - +define+AVERY_MONITOR_ON
            - '$AVERY_PLI/lib.linux/libtb_vcs64.a'
            - '-P $AVERY_PLI/tb_vcs64.tab'
  elab:
    options:
      - tool:
          vcs:
            - '$AVERY_PLI/lib.linux/libtb_vcs64.a'
            - '-P $AVERY_PLI/tb_vcs64.tab'
---
# The consuming TB selects native or UVM AXI APIs through its mode defines.
provides: [ss_avery_axi_vip]
schema_version: 2.4.0
requires:
  - ss_avery_common_vip
targets:
  tb:
    directories:
      - $AVERY_AXI/src.uvm
      - $AVERY_AXI/src.axi.VCS
      - $AVERY_AXI/src.axi
      - $CALIPTRA_AXI4PC_DIR
      - $AVERY_AXI/testbench
    files:
      - $CALIPTRA_AXI4PC_DIR/Axi4PC.sv
      - $AVERY_AXI/src.axi/aaxi_pkg.sv
      - $AVERY_AXI/src.axi/aaxi_pkg_xactor.sv
      - $AVERY_AXI/src.axi/aaxi_class_pll.sv
      - $AVERY_AXI/checker/monitor_wrapper/BP063/aaxi_monitor_wrapper.sv
      - $AVERY_AXI/src.VCS/aaxi_busmonitor.v
      - $AVERY_AXI/src.axi/aaxi_coverage_metrics.sv
      - $AVERY_AXI/src.axi/aaxi_pkg_test.sv
      - $AVERY_AXI/src.axi/aaxi_intf.sv
