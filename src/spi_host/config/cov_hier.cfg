// =============================================================================
// Caliptra-SS SPI Host Code Coverage Hierarchy Configuration
// =============================================================================
// Collect code coverage across tb.dut (caliptra_ss_spi_host), including:
//   - Top-level command/error/event/interrupt/pin-mux logic (caliptra_ss_spi_host)
//   - Register address decode, write-error checks, and RW/WO/RW1C CSR subregs (u_reg)
//   - Command FIFO queue (u_cmd_queue) and TX/RX data FIFOs (u_data_fifos)
//   - SPI core FSM, shift register, byte select, and byte merge (u_spi_core.*)
//
// Scoped exclusions below follow OpenTitan/Caliptra-SS block-DV methodology:
// 1. Pre-verified auto-generated TL-UL bus primitives & read-only status wires in u_reg:
//    - u_prim_reg_we_check / u_chk / u_reg_if / u_rsp_intg_gen / u_socket: standard
//      caliptra_prim / tlul library primitives verified in dedicated TL-UL/prim suites
//      (cmd_intg fault injection, sub-word wr_err, and unmapped addrmiss are still
//      functionally verified in spi_host_smoke_vseq Step 12).
//    - u_status_* / u_intr_state_spi_event: pure RO hardware-status wire-through subregs
//      with constant .de=1'b1 (status bit values are covered in status_cg and u_data_fifos/u_fsm).
// 2. Combinational TL-UL window adapter (u_window):
//    - Thin wire-adapting wrapper around prim_tlul_adapter_reg for RXDATA/TXDATA windows
//      whose datapath payloads, byte enables, and underflow/overflow conditions are
//      covered in tb.dut, u_data_fifos, u_select, u_merge, and unaligned_data_cg.
// 3. Bound DV observer and SVA assertion modules (non-RTL verification collateral):
//    - fast_prescaler_bound_if, tlul_assert_device, spi_host_data_stable_assert.

+tree tb.dut 0
-tree tb.dut.u_reg.u_prim_reg_we_check 0
-tree tb.dut.u_reg.u_chk 0
-tree tb.dut.u_reg.u_reg_if 0
-tree tb.dut.u_reg.u_rsp_intg_gen 0
-tree tb.dut.u_reg.u_socket 0
-tree tb.dut.u_reg.u_status_* 0
-tree tb.dut.u_reg.u_intr_state_spi_event 0
-tree tb.dut.u_window 0
-tree tb.dut.u_spi_core.fast_prescaler_bound_if 0
-tree tb.dut.tlul_assert_device 0
-tree tb.dut.spi_host_data_stable_assert 0

