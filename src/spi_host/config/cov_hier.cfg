// =============================================================================
// Caliptra-SS SPI Host Code Coverage Hierarchy Configuration
// =============================================================================
// Collect code coverage across tb.dut (spi_host_axi), including:
//   - Production AXI subsystem wrapper & AXI-to-TL-UL gasket (spi_host_axi, u_axi2tlul_spi_host)
//   - Top-level command/error/event/interrupt/pin-mux logic (u_caliptra_ss_spi_host)
//   - Register address decode, write-error checks, RW/WO/RW1C CSR subregs (u_reg),
//     and RXDATA/TXDATA FIFO window wrapper logic (u_window: wrong-direction SLVERR & mask logic)
//   - Command FIFO queue (u_cmd_queue) and TX/RX data FIFOs (u_data_fifos)
//   - SPI core FSM, shift register, byte select, and byte merge (u_spi_core.*)
//
// Scoped exclusions below cover only pre-verified library primitives and bound DV collateral:
// 1. Pre-verified auto-generated TL-UL / SECDED / onehot bus primitives & RO wire-through subregs:
//    - u_axi2tlul_cmd_intg_gen / u_chk / u_rsp_intg_gen: SECDED integrity encoder/decoder primitives.
//      NOTE: Excluding u_reg.u_chk (tlul_cmd_intg_chk, which checks both a_user.cmd_intg and
//      a_user.data_intg and steers faulted beats to u_reg_if) means quoted tb.dut code coverage
//      does not measure the internal SECDED syndrome combinational primitive gates, while bus-level
//      cmd_intg AND data_intg SECDED fault injection and intg_error_o latching are verified
//      dynamically in spi_host_closure_vseq (Comment #6).
//    - u_prim_reg_we_check: one-hot CSR address-decode fault detector (EnableAlertTriggerSVA=0 in tb.sv).
//    - u_reg_if / u_socket / u_adapter_rx / u_adapter_tx: pre-verified TL-UL bus socket/adapters
//      (while spi_host_window.sv wrong-direction error wiring & BitMaskCheck_A remain included in u_window).
//    - u_status_* / u_intr_state_spi_event: pure RO hardware-status wire-through subregs.
// 2. Bound DV observer, coverage, and SVA assertion modules:
//    - fast_prescaler_bound_if: passive FSM state observer interface.
//    - tlul_assert_device: all runtime + final TL-UL assertions execute under +define+CLP_ASSERT_ON;
//      excluded from -cm scoring because gen_device_cov instantiates OpenTitan tl_agent protocol-
//      violation cover properties (aValidNotAccepted_C, a_*ChangedNotAccepted_C) that production
//      sub2tlul.sv never drives.
//    - u_spi_cov_if & spi_host_data_stable_assert: excluded ONLY from RTL code coverage
//      (line+tgl+fsm+cond+branch) so non-RTL observer flops do not skew RTL line/toggle scores,
//      while remaining INCLUDED in -cm assert so all data-stability SVAs, a_csb_onehot0, and all 11
//      per-CS protocol cover properties are collected in URG asserts.txt!

+tree tb.dut 0
-tree tb.dut.u_axi2tlul_spi_host.i_sub2tlul.u_axi2tlul_cmd_intg_gen 0
-tree tb.dut.u_caliptra_ss_spi_host.u_reg.u_prim_reg_we_check 0
-tree tb.dut.u_caliptra_ss_spi_host.u_reg.u_chk 0
-tree tb.dut.u_caliptra_ss_spi_host.u_reg.u_reg_if 0
-tree tb.dut.u_caliptra_ss_spi_host.u_reg.u_rsp_intg_gen 0
-tree tb.dut.u_caliptra_ss_spi_host.u_reg.u_socket 0
-tree tb.dut.u_caliptra_ss_spi_host.u_reg.u_status_* 0
-tree tb.dut.u_caliptra_ss_spi_host.u_reg.u_intr_state_spi_event 0
-tree tb.dut.u_caliptra_ss_spi_host.u_window.u_adapter_rx 0
-tree tb.dut.u_caliptra_ss_spi_host.u_window.u_adapter_tx 0
-tree tb.dut.u_caliptra_ss_spi_host.u_spi_core.fast_prescaler_bound_if 0
-tree tb.dut.u_caliptra_ss_spi_host.tlul_assert_device 0

begin line+tgl+fsm+cond+branch
  -tree tb.dut.u_caliptra_ss_spi_host.u_spi_cov_if 0
  -tree tb.dut.u_caliptra_ss_spi_host.spi_host_data_stable_assert 0
end
