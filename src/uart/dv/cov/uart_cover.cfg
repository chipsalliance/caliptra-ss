// Scope code and assertion coverage strictly to the UART DUT hierarchy (excluding testbench/VIP).
+tree tb.dut

// Exclude simulation-only CDC random-delay helper inside tb.dut.
-moduletree caliptra_prim_cdc_rand_delay

// Scope combinational parity-tree condition exclusions ONLY to `cond` on pre-verified Hsiao SECDED
// primitives so line, branch, and port toggle coverage (including u_chk.u_chk.err_o[1:0],
// u_data_chk.err_o[1:0], and u_rsp_intg_gen parity outputs) remain measured in tb.dut.
begin cond
  -moduletree caliptra_prim_secded_inv_64_57_dec
  -moduletree caliptra_prim_secded_inv_64_57_enc
  -moduletree caliptra_prim_secded_inv_39_32_dec
  -moduletree caliptra_prim_secded_inv_39_32_enc
end
