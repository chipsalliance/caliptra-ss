  tb:
    files:
      - $COMPILE_ROOT/../../third_party/usb2/src/integration/rtl/usb_compound_pkg.sv
  rtl:
    files:
      - $COMPILE_ROOT/../../third_party/usb2/src/integration/rtl/usb_compound_pkg.sv
---
provides: [ip_xxx_3511_hs_mem_compound_wrapper]
schema_version: 2.4.0
requires:
  - axi_sub
  - caliptra_prim
  - lib_usb_compound
  - usb_compound_pkg
targets:
  rtl_lint:
    waiver_files:
      - $MSFT_REPO_ROOT/src/usb2/config/design_lint/sglint_waivers
  rtl:
    directories:
      - $COMPILE_ROOT/../../third_party/usb2/src/integration/rtl
    files:
      - $COMPILE_ROOT/../../third_party/usb2/src/integration/rtl/axi_to_ahb.sv
      - $COMPILE_ROOT/../../third_party/usb2/src/integration/rtl/usb_compound_ahb_decoder.sv
      - $COMPILE_ROOT/../../third_party/usb2/src/integration/rtl/ip_xxx_3511_hs_mem_compound_wrapper.sv
    tops: [ip_xxx_3511_hs_mem_compound_wrapper]
---
provides: [usb_top_tb]
schema_version: 2.4.0
requires:
  - ip_xxx_3511_hs_mem_compound_wrapper
  - usb_compound_pkg
  - avery_axi_uvm_lib
targets:
  tb:
    directories:
      - $COMPILE_ROOT/tb
      - $DESIGNWARE_HOME_USB/vip/svt/usb_svt/latest
      - $DESIGNWARE_HOME_USB/vip/svt/usb_svt/latest/sverilog/include
      - $DESIGNWARE_HOME_USB/vip/svt/mphy_svt/latest
      - $DESIGNWARE_HOME_USB/vip/svt/mphy_svt/latest/sverilog/include
    files:
      - $COMPILE_ROOT/tb/ral/generated/usb_ral_config_pkg.sv
      - $COMPILE_ROOT/tb/ral/generated/usb_combo_ral_pkg.sv
      - $COMPILE_ROOT/tb/ral/generated/usb_dev1_csr_ral_pkg.sv
      - $COMPILE_ROOT/tb/ral/generated/usb_dev0_mem_ral_pkg.sv
      - $COMPILE_ROOT/tb/ral/generated/usb_dev1_mem_ral_pkg.sv
      - $COMPILE_ROOT/tb/usb_tb_pkg.sv
      - $COMPILE_ROOT/tb/usb_axi_manager_connection.sv
      - $COMPILE_ROOT/tb/usb_top_tb.sv
    tops: [usb_top_tb]
global:
  tool:
    vcs:
      default:
        - '-sverilog -full64'
        - '-assert svaext'
        - '-debug_access+all'
        - '-noinherit_timescale=1ns/1ps'
        # Match the subsystem's handling of redundant Avery package imports.
        - '-suppress=SV-LCM-PPWI'
        - +define+SIMULATION
        - +define+UVM
        - +define+AVERY_VCS
        - +define+AVERY_ASSERT_ON
        - +define+AVERY_MONITOR_ON
        - +define+AVERY_AXI_UVM
        - +define+AVERY_UVM
        - +define+AVERY_AXI_USER
        - +define+AVERY_NAMED_CONSTRUCTOR
        - +define+AAXI_MAX_DATA_WIDTH=32
        - +define+AAXI_MAX_ADDR_WIDTH=32
        - +define+AAXI_MAX_ID_WIDTH=5
        - +define+AAXI_MAX_ARUSER_WIDTH=32
        - +define+AAXI_MAX_AWUSER_WIDTH=32
        - +define+AAXI_MAX_WUSER_WIDTH=32
        - +define+AAXI_MAX_BUSER_WIDTH=32
        - +define+AAXI_MAX_RUSER_WIDTH=32
        - +define+SVT_UVM_TECHNOLOGY
        - +define+UVM_PACKER_MAX_BYTES=24000
        - +define+UVM_DISABLE_AUTO_ITEM_RECORDING
        - +define+SYNOPSYS_SV
        - +define+DESIGNWARE_INCDIR=$DESIGNWARE_HOME
        - +define+SVT_LOADER_UTIL_ENABLE_DWHOME_INCDIRS
        - +define+SVT_VERSION=latest
        - +define+SVT_MPHY_PKG_LOAD
        - '$AVERY_PLI/lib.linux/libtb_vcs64.a'
        - '-P $AVERY_PLI/tb_vcs64.tab'
      elab:
        # The TB instantiates axi_if; the separately analyzed RTL copy is unused.
        - '+warn=noUII-L'
        - '-suppress=SIMU-RESOLUTION,DRTZ'
        - '$AVERY_PLI/lib.linux/libtb_vcs64.a'
        - '-P $AVERY_PLI/tb_vcs64.tab'
      sim:
        - '+vpi'
        - '+svt_debug_opts'
