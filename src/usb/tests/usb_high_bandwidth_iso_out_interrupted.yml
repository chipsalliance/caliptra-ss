# Disabled from regression while bug-usb-hb-iso-out-sof-retirement is open.
# At a valid 125 us SOF boundary after one or two MDATA packets, the descriptor
# must retire with residual 2048 or 1024, report the interval error, and
# generate exactly one writeback. The next interval must accept fresh data.
---
seed: 1
testname: usb_high_bandwidth_iso_out_interrupted
plusargs:
  - '+UVM_TESTNAME=usb_high_bandwidth_iso_out_interrupted_test'
