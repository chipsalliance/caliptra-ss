#
# Exchanges and checks three 1024-byte high-speed isochronous transactions per
# service interval on EP2 OUT and IN.
#
# Disabled from regression while bug-usb-hb-iso-in-sof-abort-replay is open.
# If SOF interrupts ISO IN, the current RTL replays transmitted data instead
# of preserving endpoint progress.
---
seed: 1
testname: usb_high_bandwidth_iso
plusargs:
  - '+UVM_TESTNAME=usb_high_bandwidth_iso_test'
