#
# Reuses the double-buffer test, then checks nine routed responses in each
# single active bulk host sequence without changing the response queue depth.
---
seed: 1
testname: usb_bulk_response_stress
plusargs:
  - '+UVM_TESTNAME=usb_double_buffer_bulk_test'
  - '+usb_bulk_response_stress_count=9'
