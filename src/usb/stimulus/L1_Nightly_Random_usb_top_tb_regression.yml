document:
  schema: 1.0

contents:
  - generator:
      tags: ["L1", "usb_top_tb", "Random", "Nightly"]
      path: ""
      mode: round-robin
      weight: 100
      generations: 5
      formats:
        generate: "reseed {template}.yml -seed {seed}"
        path: "{template_basename}__{seed}.yml"
      templates:
        $CALIPTRA_SS_ROOT/src/usb/tests/usb_axi_stress: { weight: 100 }
        $CALIPTRA_SS_ROOT/src/usb/tests/usb_ocp_bringup: { weight: 100 }
        $CALIPTRA_SS_ROOT/src/usb/tests/usb_ocp_dev0_ep0_interleave: { weight: 100 }
        $CALIPTRA_SS_ROOT/src/usb/tests/usb_ocp_dev0_epn_overlap: { weight: 100 }
        $CALIPTRA_SS_ROOT/src/usb/tests/usb_ocp_dev1_ep0_overlap: { weight: 100 }
        $CALIPTRA_SS_ROOT/src/usb/tests/usb_ocp_dev1_epn_overlap: { weight: 100 }
        $CALIPTRA_SS_ROOT/src/usb/tests/usb_ocp_mixed_traffic: { weight: 100 }
        $CALIPTRA_SS_ROOT/src/usb/tests/usb_ocp_suspend_resume: { weight: 100 }
        $CALIPTRA_SS_ROOT/src/usb/tests/usb_ocp_suspend_resume_dev0: { weight: 100 }
        $CALIPTRA_SS_ROOT/src/usb/tests/usb_ocp_suspend_resume_dev1: { weight: 100 }
