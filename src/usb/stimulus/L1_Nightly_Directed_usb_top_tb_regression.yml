document:
  schema: 1.0

contents:
  - generator:
      tags: ["L1", "usb_top_tb", "Directed", "Nightly"]
      path: ""
      mode: round-robin
      weight: 100
      generations: 3
      formats:
        generate: "reseed {template}.yml -seed {seed}"
        path: "{template_basename}__{seed}.yml"
      templates:
        $CALIPTRA_SS_ROOT/src/usb/tests/usb_init: { weight: 100 }
        $CALIPTRA_SS_ROOT/src/usb/tests/usb_endpoint_rw: { weight: 100 }
        $CALIPTRA_SS_ROOT/src/usb/tests/usb_axi_filter: { weight: 100 }
        $CALIPTRA_SS_ROOT/src/usb/tests/usb_axi_read_backpressure: { weight: 100 }
        $CALIPTRA_SS_ROOT/src/usb/tests/usb_axi_write_backpressure: { weight: 100 }
        $CALIPTRA_SS_ROOT/src/usb/tests/usb_dev_skip: { weight: 100 }
        $CALIPTRA_SS_ROOT/src/usb/tests/usb_dev_skip_during_rx: { weight: 100 }
        $CALIPTRA_SS_ROOT/src/usb/tests/usb_unsupported_request: { weight: 100 }
        $CALIPTRA_SS_ROOT/src/usb/tests/usb_utility_timeout: { weight: 100 }
