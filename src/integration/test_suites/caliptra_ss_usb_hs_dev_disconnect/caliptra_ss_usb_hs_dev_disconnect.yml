seed: 1
testname: caliptra_ss_usb_hs_dev_disconnect
pre-exec: |
  set -eu
  echo "Running pre_exec for test caliptra_ss_usb_hs_dev_disconnect"
  make -f $CALIPTRA_SS_ROOT/tools/scripts/Makefile \
       TESTNAME=caliptra_ss_usb_hs_dev_disconnect \
       CALIPTRA_TESTNAME=cptra_bringup \
       CALIPTRA_AUX=soc_ifc_ss \
       CALIPTRA_SS_CLK_FREQ=400 \
       mcu_program.hex \
       cptra_program.hex
plusargs:
  - '+UVM_TESTNAME=caliptra_ss_usb_hs_dev_disconnect_test'
  # Enables caliptra_ss_mcu_console_fail_checker.sv, which turns any MCU
  # console line containing FAIL into a UVM_ERROR. Without it a firmware
  # failure such as "MCU: FAIL - enumeration timeout (got 0 of 3)" only
  # printed to mcu_console.log and the run still reported TESTCASE PASSED,
  # because firmware signals failure by halting, exactly as it does on
  # success. The "=1" form is required: run_caliptra_test.py only forwards
  # plusargs matching +NAME=VALUE, and $test$plusargs matches on prefix so
  # the value itself is ignored.
  - '+mcu_console_fail_check=1'
  # No VBus plusargs are needed. VIP-owned VBus is now the unconditional
  # testbench default: caliptra_ss_top_tb.sv leaves utmi_dut_mac_if.VbusValid
  # undriven so the Synopsys VIP physical layer is its only driver, and
  # caliptra_ss_usb_vbus_driver.sv always forwards the resolved value to the
  # DUT cptra_ss_usb_USB_VBus_i / cptra_ss_usb_sessend_i pins. See
  # docs/usb_vip_vbus_ownership.md.
