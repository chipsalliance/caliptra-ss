seed: 1
testname: caliptra_ss_usb_fs_clock
pre-exec: |
  set -eu
  echo "Running pre_exec for test caliptra_ss_usb_fs_clock"
  make -f $CALIPTRA_SS_ROOT/tools/scripts/Makefile \
       TESTNAME=caliptra_ss_usb_fs_clock \
       CALIPTRA_TESTNAME=cptra_bringup \
       CALIPTRA_AUX=soc_ifc_ss \
       CALIPTRA_SS_CLK_FREQ=400 \
       mcu_program.hex \
       cptra_program.hex
plusargs:
  - '+UVM_TESTNAME=caliptra_ss_usb_fs_clock_test'
  # Enables caliptra_ss_usb_fs_speed_checker.sv. The "=1" form is required:
  # run_caliptra_test.py only forwards plusargs matching +NAME=VALUE, and
  # $test$plusargs() matches on prefix so the value itself is ignored.
  - '+usb_fs_speed_check=1'
