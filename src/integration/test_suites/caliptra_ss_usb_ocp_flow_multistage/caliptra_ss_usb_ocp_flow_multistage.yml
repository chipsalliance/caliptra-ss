seed: 1
testname: caliptra_ss_usb_ocp_flow_multistage
pre-exec: |
  set -eu
  python3 $CALIPTRA_SS_ROOT/src/integration/test_suites/caliptra_ss_usb_ocp_flow_multistage/build_images.py
  make -f $CALIPTRA_SS_ROOT/tools/scripts/Makefile \
       TESTNAME=caliptra_ss_usb_ocp_flow_multistage \
       CALIPTRA_TESTNAME=cptra_usb_ocp_flow_multistage \
       CALIPTRA_AUX=usb_ocp_recovery_cptra \
       CALIPTRA_SS_CLK_FREQ=400 \
       mcu_program.hex cptra_program.hex
plusargs:
  - '+UVM_TESTNAME=caliptra_ss_usb_ocp_flow_multistage_test'
