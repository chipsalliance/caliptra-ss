seed: 1
testname: caliptra_ss_usb_hs_dev_hub_port_suspend_remotewake
pre-exec: |
  set -eu
  echo "Running pre_exec for test caliptra_ss_usb_hs_dev_hub_port_suspend_remotewake"
  make -f $CALIPTRA_SS_ROOT/tools/scripts/Makefile \
       TESTNAME=caliptra_ss_usb_hs_dev_hub_port_suspend_remotewake \
       CALIPTRA_TESTNAME=cptra_bringup \
       CALIPTRA_AUX=soc_ifc_ss \
       CALIPTRA_SS_CLK_FREQ=400 \
       mcu_program.hex \
       cptra_program.hex
plusargs:
  - '+UVM_TESTNAME=caliptra_ss_usb_hs_dev_hub_port_suspend_remotewake_test'
  # usb_suspend_resume_check is deliberately NOT enabled: the upstream bus is
  # never suspended here, only a downstream hub port.
