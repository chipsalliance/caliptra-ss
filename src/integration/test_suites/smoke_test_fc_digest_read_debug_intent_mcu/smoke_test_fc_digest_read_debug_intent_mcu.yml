---
seed: ${PLAYBOOK_RANDOM_SEED}
testname: smoke_test_fc_digest_read_debug_intent_mcu
pre-exec: |
  echo "Running pre_exec for [smoke_test_fc_digest_read_debug_intent_mcu]"
    rm -rf otp-img.2048.vmem
  $CALIPTRA_SS_ROOT/tools/scripts/fuse_ctrl_script/gen_fuse_ctrl_vmem.py --lc-state 16 --lc-state-def $CALIPTRA_SS_ROOT/tools/scripts/fuse_ctrl_script/lc_ctrl_state.hjson --add-cfg $CALIPTRA_SS_ROOT/src/integration/test_suites/smoke_test_fc_digest_read_debug_intent_mcu/secret_partitions_locked.hjson --mmap-def $CALIPTRA_SS_ROOT/src/fuse_ctrl/data/otp_ctrl_mmap.hjson --token-configuration $CALIPTRA_SS_ROOT/src/integration/test_suites/smoke_test_fc_digest_read_debug_intent_mcu/test_unlock_token.hjson -o otp-img.2048.vmem &&
  CALIPTRA_ROOT=$CALIPTRA_SS_ROOT/third_party/caliptra-rtl make -f $CALIPTRA_SS_ROOT/third_party/caliptra-rtl/tools/scripts/Makefile CALIPTRA_INTERNAL_TRNG=0 TESTNAME=smoke_test_mbox program.hex &&
  make -f $CALIPTRA_SS_ROOT/tools/scripts/Makefile TESTNAME=smoke_test_fc_digest_read_debug_intent_mcu mcu_program.hex
