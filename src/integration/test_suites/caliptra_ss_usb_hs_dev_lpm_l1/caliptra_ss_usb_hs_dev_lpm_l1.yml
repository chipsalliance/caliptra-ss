seed: 1
testname: caliptra_ss_usb_hs_dev_lpm_l1
pre-exec: |
  set -eu
  echo "Running pre_exec for test caliptra_ss_usb_hs_dev_lpm_l1"
  make -f $CALIPTRA_SS_ROOT/tools/scripts/Makefile \
       TESTNAME=caliptra_ss_usb_hs_dev_lpm_l1 \
       CALIPTRA_TESTNAME=cptra_bringup \
       CALIPTRA_AUX=soc_ifc_ss \
       CALIPTRA_SS_CLK_FREQ=400 \
       mcu_program.hex \
       cptra_program.hex
plusargs:
  - '+UVM_TESTNAME=caliptra_ss_usb_hs_dev_lpm_l1_test'
  - '+usb_suspend_resume_check=1'
#  - '+usb_lpm_dev_wakeup=1'

# HOST-DRIVEN L1 exit. The sequence runs
# svt_usb_link_service_clear_l1suspend_sequence and the firmware only observes
# LPM_SUS falling. The DEVICE-DRIVEN counterpart is a separate suite,
# caliptra_ss_usb_hs_dev_lpm_l1_dev_wakeup, because the firmware leg is a
# compile-time choice (USB_LPM_DEVICE_INITIATED_EXIT) and MCU firmware cannot
# read UVM plusargs - the two legs cannot share one image.

