seed: 1
testname: caliptra_ss_usb_ocp_setup_address_handoff
pre-exec: |
  set -eu
  echo "Running pre_exec for test caliptra_ss_usb_ocp_setup_address_handoff"
  make -f $CALIPTRA_SS_ROOT/tools/scripts/Makefile \
       TESTNAME=caliptra_ss_usb_ocp_setup_supersession \
       CALIPTRA_TESTNAME=cptra_bringup \
       CALIPTRA_TEST_DIR=$CALIPTRA_SS_ROOT/src/integration/test_suites/libs/usb/bringup \
       CALIPTRA_AUX=soc_ifc_ss \
       CALIPTRA_SS_CLK_FREQ=400 \
       mcu_program.hex \
       cptra_program.hex
plusargs:
  - '+UVM_TESTNAME=caliptra_ss_usb_ocp_setup_address_handoff_test'
  - '+UVM_TIMEOUT=200000000000ps'
