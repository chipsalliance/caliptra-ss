seed: 1
testname: caliptra_ss_usb_usbd1_conn
pre-exec: |
  set -eu
  echo "Running pre_exec for test caliptra_ss_usb_usbd1_conn"
  make -f $CALIPTRA_SS_ROOT/tools/scripts/Makefile \
       TESTNAME=caliptra_ss_usb_usbd1_conn \
       CALIPTRA_TESTNAME=cptra_bringup \
       CALIPTRA_AUX=soc_ifc_ss \
       CALIPTRA_SS_CLK_FREQ=400 \
       BUILD_CFLAGS="-DUSB_DEV_SEL=1" \
       mcu_program.hex \
       cptra_program.hex
plusargs:
  - '+UVM_TESTNAME=caliptra_ss_usb_usbd1_conn_test'
