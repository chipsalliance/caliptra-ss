seed: 1
testname: caliptra_ss_usb_fs_dev_global_suspend_L2
pre-exec: |
  set -eu
  echo "Running pre_exec for test caliptra_ss_usb_fs_dev_global_suspend_L2"
  make -f $CALIPTRA_SS_ROOT/tools/scripts/Makefile \
       TESTNAME=caliptra_ss_usb_fs_dev_global_suspend_L2 \
       CALIPTRA_TESTNAME=cptra_bringup \
       CALIPTRA_AUX=soc_ifc_ss \
       CALIPTRA_SS_CLK_FREQ=400 \
       mcu_program.hex \
       cptra_program.hex
plusargs:
  - '+UVM_TESTNAME=caliptra_ss_usb_fs_dev_global_suspend_L2_test'
  # Enables caliptra_ss_usb_suspend_resume_checker.sv, which owns the DUT-side
  # pass/fail condition for this test (UTMI SuspendM low then high again). The
  # "=1" form is required: run_caliptra_test.py only forwards plusargs matching
  # +NAME=VALUE, and $test$plusargs() matches on prefix so the value itself is
  # ignored. Without this the checker is inert and the test cannot fail on DUT
  # behaviour.
  - '+usb_suspend_resume_check=1'
