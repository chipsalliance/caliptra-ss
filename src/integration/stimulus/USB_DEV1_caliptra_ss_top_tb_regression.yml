# USBDC1 (device1) regression test list for Caliptra-SS.
#
# This list contains ONLY the dev1 replicated test cases. They are the same
# scenarios as the dev (USBDC0) tests, retargeted to the second embedded
# device controller: the host brings up hub downstream port 2 and the
# firmware is built with -DUSB_DEV_SEL=1 so that it drives the USBDC1
# aperture (regs 0x2001_0000, DMA 0x2001_0100).
#
# See claude_md/15_usb_dev1_replication.md for the full mechanism.
#
# Run with:
#   python3 ./caliptra-ss/tools/run_usb_regression.py \
#       -regr_dir ./usb_regr_dev1 \
#       -testlist ./caliptra-ss/src/integration/stimulus/USB_DEV1_caliptra_ss_top_tb_regression.yml \
#       -parallel 2
#
# NOTE: keep the entries below as bare names (no trailing comments on the
# same line). The regression driver has a non-PyYAML fallback parser that
# stops collecting at the first list item it cannot match.
  - tests:
      # HS (high-speed) USBDC1 test cases
      - caliptra_ss_usb_hs_dev1_bulk_out
      - caliptra_ss_usb_hs_dev1_nbyte
      - caliptra_ss_usb_hs_dev1_iso_out
      - caliptra_ss_usb_hs_dev1_bulk_loopback
      - caliptra_ss_usb_hs_dev1_disconnect
      - caliptra_ss_usb_hs_dev1_powerdown
      - caliptra_ss_usb_hs_dev1_global_suspend_L2
      - caliptra_ss_usb_hs_dev1_resume
      - caliptra_ss_usb_hs_dev1_get_status
      - caliptra_ss_usb_hs_dev1_hub_qualifier
      - caliptra_ss_usb_hs_dev1_get_hub_status
      - caliptra_ss_usb_hs_dev1_get_device_descriptor
      #
      # Bring-up / link-observation USBDC1 test cases (counterparts of the
      # dev0 caliptra_ss_usb_init, hs_clock, hs_conn and usbd_conn tests).
      - caliptra_ss_usb_dev1_init
      - caliptra_ss_usb_hs_dev1_clock
      - caliptra_ss_usb_hs_dev1_conn
      - caliptra_ss_usb_usbd1_conn
      #
      # FS (full-speed) USBDC1 test cases - DISCARDED, kept for reference.
      #
      # The compound instantiates a single shared link engine (usb_pie_1);
      # device0 owns the link speed selection and defaults to High Speed, so
      # device1 alone cannot select Full Speed. This is designed behaviour
      # (confirmed with the designer) and is under discussion for a possible
      # future change to per-device speed control. Until then a dev1-only FS
      # bring-up is not a supported configuration and the tests below are
      # invalid stimulus rather than real failures. They stay in the tree so
      # they can be re-enabled by simply uncommenting these lines.
      # See claude_md/15_usb_dev1_replication.md section 8.
      #
      #- caliptra_ss_usb_fs_dev1_bulk_loopback
      #- caliptra_ss_usb_fs_dev1_bulk_out
      #- caliptra_ss_usb_fs_dev1_disconnect
      #- caliptra_ss_usb_fs_dev1_iso_out
      #- caliptra_ss_usb_fs_dev1_nbyte
      #- caliptra_ss_usb_fs_dev1_powerdown
      #- caliptra_ss_usb_fs_dev1_global_suspend_L2
      #- caliptra_ss_usb_fs_dev1_resume


